x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "10"
      compress: "true"


services:
  bitwarden:
    # Standard Bitwarden is very resource-heavy and cannot run on micro cloud instances
    # Vaultwarden is a Rust (mostly) feature-complete implementation of Bitwarden
    # https://github.com/dani-garcia/vaultwarden
    image: vaultwarden/server:latest-alpine
    restart: ${BWGC_RESTART_POLICY:-always}
    container_name: bitwarden
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 320m
    pids_limit: 200
    depends_on:
    - proxy
    <<: *default-logging
    volumes:
    - ${PWD}/bitwarden:/data
    environment:
    - LOG_FILE=/data/bitwarden.log
    # vaultwarden has no log rotation, and at its default "info" level it writes
    # a request/response pair for every HTTP call. Left alone this file grows
    # without bound. Every line the fail2ban filters match is logged at ERROR,
    # so "warn" loses no protection. Set LOG_LEVEL=info in .env when debugging.
    - LOG_LEVEL=${LOG_LEVEL:-warn}
    - SHOW_PASSWORD_HINT=false
    # This vault is only used from the apps and the browser extension, which
    # talk to the API. Without the web vault there is no page serving the
    # login form to phish or tamper with. It also breaks the flows that open
    # a web page: viewing a Send, accepting an organisation or emergency access
    # invitation, verifying an email, and WebAuthn/FIDO2 2FA in some clients.
    - WEB_VAULT_ENABLED=false
    - DOMAIN=https://${DOMAIN}          # DOMAIN is set in .env but doesn't have protocol prefix
    - IP_HEADER=X-Real-IP
    - ADMIN_TOKEN                       # Value-less variables are set in .env
    - SIGNUPS_ALLOWED
    - SMTP_HOST
    - SMTP_FROM
    - SMTP_FROM_NAME=Bitwarden (${DOMAIN})
    - SMTP_PORT
    - SMTP_SECURITY
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - PUSH_ENABLED
    - PUSH_INSTALLATION_ID
    - PUSH_INSTALLATION_KEY
    - YUBICO_CLIENT_ID
    - YUBICO_SECRET_KEY
    - YUBICO_SERVER
    - ORG_CREATION_USERS
    - TZ


  backup:
    #build: ./docker/backup                                     # backup, in case container registry is not responsive
    # From https://github.com/Striffly/bwgc_backup: upstream master plus CI fixes.
    # Built, scanned and signed by that repository's CI, rebuilt daily when
    # Alpine packages fall behind.
    image: ghcr.io/striffly/bwgc_backup:master
    restart: ${BWGC_RESTART_POLICY:-on-failure}
    container_name: backup
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 192m
    pids_limit: 100
    depends_on:
    - bitwarden
    <<: *default-logging
    volumes:
      - ${PWD}/.env:/.env:ro
      - ${PWD}/bitwarden:/data
      - ${PWD}/bitwarden/rclone:/data/rclone
      - ${PWD}/bitwarden/backups:/data/backups
    environment:
    - BACKUP                            # Value-less variables are set in .env
    - BACKUP_SCHEDULE
    - BACKUP_DAYS
    - BACKUP_DIR
    - BACKUP_ENCRYPTION_KEY
    - BACKUP_EMAIL_TO
    - BACKUP_EMAIL_NOTIFY
    - BACKUP_EMAIL_NOTIFY_ON_FAILURE_ONLY
    - BACKUP_RCLONE_CONF
    - BACKUP_RCLONE_DEST
    - BACKUP_ENV
    # Weekly check: is this host's OS milestone still supported, and has a
    # backup actually run recently? Both fail silently otherwise.
    # CHECK_SCHEDULE=disabled turns it off.
    - CHECK_SCHEDULE
    - BACKUP_MAX_AGE_DAYS
    - SMTP_HOST
    - SMTP_FROM
    - SMTP_FROM_NAME=Bitwarden Backup (${DOMAIN})
    - SMTP_PORT
    - SMTP_SECURITY
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - TZ


  proxy:
    # Caddy provides an automatic HTTPS reverse proxy with Let's Encrypt cert provisioning
    # Uses local Dockerfile to include tzdata package
    # https://caddyserver.com/
    #build: ./docker/proxy                              # backup, in case container registry is not responsive
    # From https://github.com/Striffly/bwgc_caddy: upstream master plus CI fixes.
    # Built, scanned and signed by that repository's CI, rebuilt daily when the
    # caddy:alpine base or its packages change.
    image: ghcr.io/striffly/bwgc_caddy:master
    restart: ${BWGC_RESTART_POLICY:-always}
    container_name: proxy
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 128m
    pids_limit: 100
    <<: *default-logging
    volumes:
    - ${PWD}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    - ${PWD}/caddy/data:/data
    - caddycerts:/root/.caddy
    ports:
    - 80:80                             # Port 80 is necessary for Let's Encrypt ACME
    - 443:443
    environment:
    - ACME_AGREE=true                   # agree to ACME for auto HTTPS
    - DOMAIN                            # Value-less variables are set in .env
    - EMAIL
    - TZ


  ddns:
    # This provides a ddclient dynamic dns updating cron which is as simple as running it
    # and editing the ddns/config/ddclient.conf file
    # https://github.com/linuxserver/docker-ddclient
    image: linuxserver/ddclient
    restart: ${BWGC_RESTART_POLICY:-always}
    container_name: ddns
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 64m
    pids_limit: 50
    <<: *default-logging
    depends_on:
    - bitwarden
    volumes:
    - ${PWD}/ddns:/config
    environment:
    - PUID
    - PGID
    - TZ


  # Uncomment if you want fail2ban to send e-mails,
  # and adjust the depends_on directive in the fail2ban service,
  # see https://github.com/crazy-max/docker-fail2ban/pull/169/files
  # msmtpd:
  #   image: crazymax/msmtpd:latest
  #   restart: always
  #   container_name: fail2ban_msmtpd
  #   <<: *default-logging
  #   ports:
  #   - "127.0.0.1:2500:2500"
  #   environment:
  #   - TZ
  #   - SMTP_HOST
  #   - SMTP_PORT
  #   - SMTP_AUTH=on
  #   - SMTP_USER=${SMTP_USERNAME}
  #   - SMTP_PASSWORD
  #   - SMTP_FROM
  #   - SMTP_TLS


  fail2ban:
    # Implements fail2ban functionality, banning ips that
    # try to bruteforce your vault
    # https://github.com/dani-garcia/vaultwarden/wiki/Fail2Ban-Setup
    # https://github.com/crazy-max/docker-fail2ban
    image: crazymax/fail2ban:latest
    restart: ${BWGC_RESTART_POLICY:-always}
    container_name: fail2ban
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 128m
    pids_limit: 100
    <<: *default-logging
    depends_on:
    - bitwarden
    volumes:
    - ${PWD}/fail2ban:/data
    - ${PWD}/bitwarden:/bitwarden:ro
    - /run/systemd/journal:/run/systemd/journal:ro 
    network_mode: "host"
    cap_add:
    - NET_ADMIN
    - NET_RAW
    environment:
    - F2B_DB_PURGE_AGE=30d
    - F2B_LOG_LEVEL=INFO
    - F2B_IPTABLES_CHAIN=INPUT
    - TZ


  countryblock:
    # The block script will block any country (defaults to CN and AU)
    # Requires cap_add as listed because it uses iptables and ipset
    # https://hub.docker.com/_/alpine/
    #build: ./docker/countryblock                       # backup, in case container registry is not responsive
    # From https://github.com/Striffly/bwgc_countryblock: upstream master plus the
    # pending PRs (DOCKER-USER filtering, backend cleanup...). Built, scanned and
    # signed by that repository's CI, rebuilt daily when Alpine packages fall behind.
    image: ghcr.io/striffly/bwgc_countryblock:master
    restart: ${BWGC_RESTART_POLICY:-always}
    container_name: countryblock
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 128m
    pids_limit: 100
    <<: *default-logging
    depends_on:
    - bitwarden
    network_mode: "host"
    cap_add:
    - NET_ADMIN
    - NET_RAW
    environment:
    - COUNTRIES
    - COUNTRYBLOCK_SCHEDULE
    - TZ


  watchtower:
    # Watchtower will pull down your new image, gracefully shut down your existing container
    # and restart it with the same options that were used when it was deployed initially
    # https://github.com/nicholas-fedor/watchtower
    #
    # Major-version tag: 1.x updates arrive through watchtower itself, subject to
    # the cooldown below, but a breaking 2.0 never does on its own.
    image: nickfedor/watchtower:1
    restart: ${BWGC_RESTART_POLICY:-always}
    container_name: watchtower
    labels:
    - "com.centurylinklabs.watchtower.enable=true"
    mem_limit: 96m
    pids_limit: 100
    # Always on in this deployment, restricted by WATCHTOWER_LABEL_ENABLE and
    # WATCHTOWER_COOLDOWN_DELAY below. The bwgc images all come from the
    # Striffly forks, so every container here is updated automatically.
    <<: *default-logging
    depends_on:
    - bitwarden
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - WATCHTOWER_CLEANUP=true
    - WATCHTOWER_SCHEDULE
    # Only update containers labelled com.centurylinklabs.watchtower.enable=true.
    - WATCHTOWER_LABEL_ENABLE=true
    # Only apply an image once it is 3 days old, so a compromised or broken
    # release has time to be noticed and pulled first. Applies to every
    # container watchtower updates, itself included. The age comes from the
    # image's own build date.
    - WATCHTOWER_COOLDOWN_DELAY=3d
    - TZ


volumes:
  caddycerts:
